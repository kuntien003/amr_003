controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:

    publish_rate: 50.0

    base_frame_id: base_footprint

    # Tên joint giữ nguyên (không đổi dù link đổi tên)
    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']

    # CẬP NHẬT từ URDF mới (SolidWorks):
    # left_wheel  y = +0.27487
    # right_wheel y = -0.27559
    # separation  = 0.27487 + 0.27559 = 0.55046
    wheel_separation: 0.572
    wheel_radius: 0.037

    use_stamped_vel: false

    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: false
    linear.x.has_jerk_limits: false
    linear.x.max_velocity:  1.5
    linear.x.min_velocity: -1.5
    linear.x.max_acceleration: 0.5
    linear.x.min_acceleration: -1.5

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: false
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 1.0
    angular.z.min_acceleration: -2.0

joint_broad:
  ros__parameters:
    use_sim_time: true